# HTTP Server Block - Force Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name notsave.pamtok.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block - Reverse Proxy to Node.js Backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notsave.pamtok.com;

    # SSL Certbot Certificates
    ssl_certificate /etc/letsencrypt/live/notsave.pamtok.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notsave.pamtok.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security HTTP Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging Configuration
    access_log /var/log/nginx/notsave.pamtok.com.access.log;
    error_log /var/log/nginx/notsave.pamtok.com.error.log;

    # Proxy settings to Node.js Backend (running on localhost:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP header forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for API reliability
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
